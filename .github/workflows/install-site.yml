name: Install site bundle

on:
  push:
    branches: [main]
    paths:
      - '.site-bundle-trigger'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .site-bundle-trigger ]; then
            echo "Trigger removed; nothing to install."
            exit 0
          fi
          rm -rf /tmp/day96-site
          mkdir -p /tmp/day96-site
          unzip -q .site_bundle/site.zip -d /tmp/day96-site
          cp -a /tmp/day96-site/izzna-editable/. .
          rm -rf .site_bundle .site-bundle-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "Deploy updated Day 96 site"
          git push
